name: Contribution Snake

on:
  schedule:
    - cron: '0 0 * * *' # every day at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Generate Snake
        uses: platane/snk@v1.0.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

